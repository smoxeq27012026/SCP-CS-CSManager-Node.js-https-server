<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DELTAxEX :: CSManager - Нет доступа</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      /* Вставь те же глобальные стили (root, body, анимации) */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg-dark: #0a0d10;
        --bg-card: rgba(20, 24, 30, 0.6);
        --bg-sidebar: rgba(15, 18, 23, 0.85);
        --bg-input: rgba(30, 35, 42, 0.5);
        --border-color: rgba(60, 70, 85, 0.3);
        --text-primary: #e8eaed;
        --text-secondary: #9ca3af;
        --accent-green: #3b9d6f;
        --accent-hover: #48b583;
        --glass-bg: rgba(25, 30, 38, 0.4);
        --shadow-glow: 0 4px 24px rgba(59, 157, 111, 0.15);
      }

      body {
        font-family: "Inter", sans-serif;
        background: linear-gradient(135deg, #0a0d10 0%, #151a22 100%);
        color: var(--text-primary);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      body::before {
        /* сетка */
      }
      .error-card {
        background: var(--bg-card);
        backdrop-filter: blur(20px);
        border: 1px solid var(--border-color);
        border-radius: 20px;
        padding: 40px;
        text-align: center;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        animation: fadeInUp 0.6s ease;
      }
      .error-card i {
        font-size: 48px;
        color: var(--accent-green);
        margin-bottom: 16px;
      }
      .error-card h2 {
        font-size: 24px;
        margin-bottom: 8px;
      }
      .error-card p {
        color: var(--text-secondary);
        margin-bottom: 24px;
      }
      .btn {
        /* стили как выше */
      }
      .btn-secondary {
        background: transparent;
        color: var(--text-primary);
        border: 1px solid var(--border-color);
      }
      .btn-secondary:hover {
        background: var(--glass-bg);
        border-color: var(--accent-green);
      }
    </style>
  </head>
  <body>
    <div class="error-card">
      <i class="fas fa-lock"></i>
      <h2>У вас нет прав</h2>
      <p>
        Для доступа к этой странице необходимо авторизоваться через Discord или
        иметь соответствующие права.
      </p>
      <a href="/auth/login" class="btn btn-secondary">Войти</a>
    </div>
  </body>
</html>
